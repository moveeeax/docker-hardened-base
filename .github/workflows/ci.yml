name: CI

# Gate every push on the hardening promise: the policy linter and its unit
# tests first (fast, no daemon), then a real multi-stage build of both images,
# a Trivy scan with a zero-HIGH/CRITICAL policy, an SBOM per image, and a bats
# smoke test that proves the built images run as non-root with no shell.
# Runs on GitHub-hosted ubuntu-latest runners.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 bats curl ca-certificates

      - name: Policy lint + unit tests
        run: |
          set -eux
          python3 scripts/policy.py images/go/Dockerfile images/python/Dockerfile
          python3 -m unittest discover -s test -p '*_test.py' -v

      - name: Build images
        run: |
          set -eux
          docker build -q -f images/go/Dockerfile -t hardened-go:ci .
          docker build -q -f images/python/Dockerfile -t hardened-python:ci .

      - name: Install Trivy + Syft
        run: |
          set -eux
          # Install script and binary are both pinned to a release tag so the
          # gate does not change under us between runs.
          TRIVY_VERSION=v0.76.1
          SYFT_VERSION=v1.55.0
          curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" \
            | sudo sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
          curl -sfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            | sudo sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
          trivy --version
          syft version

      - name: Trivy scan (block on HIGH/CRITICAL)
        run: |
          set -eux
          for img in hardened-go:ci hardened-python:ci; do
            trivy image --quiet --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed "$img"
          done

      - name: Generate SBOMs
        run: |
          set -eux
          mkdir -p sbom
          syft hardened-go:ci -o spdx-json=sbom/hardened-go.spdx.json
          syft hardened-python:ci -o spdx-json=sbom/hardened-python.spdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms
          path: sbom/

      - name: Smoke test images
        run: bats test/smoke.bats
